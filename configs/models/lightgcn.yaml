# LightGCN-style propagation (He et al., 2020) through the same GNN module: symmetric-normalised
# neighbour sum, no weight matrices, no nonlinearity, layer outputs averaged.
# Added after the GraphSAGE diagnostics (results/logs/gnn_training_diagnostics.txt): it answers
# whether the graph propagation or the learned per-layer transforms are the problem.
model: gnn
conv: lgc
num_layers: 2
embedding_dim: 64
jk: mean
dropout: 0.0
use_id: true
use_content: false
remove_target_edges: true
user_id_dropout: 0.1
item_id_dropout: 0.0
l2_reg: 0.0001
lr: 0.001
batch_size: 8192
epochs: 300
patience: 20
num_negatives: 1
