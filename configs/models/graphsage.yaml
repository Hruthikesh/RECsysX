model: gnn
conv: sage
num_layers: 2
embedding_dim: 64
aggr: mean
jk: mean                # combine layer outputs (incl. layer 0) by averaging
dropout: 0.1
use_id: true
use_content: false
remove_target_edges: true
user_id_dropout: 0.1
item_id_dropout: 0.0
l2_reg: 0.0001
lr: 0.001
batch_size: 8192        # one full-graph forward pass per batch
epochs: 200
patience: 20
num_negatives: 1
